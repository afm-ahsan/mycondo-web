name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-test-build:
    name: Install, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (Vitest — PF-5)
        run: npm run test

      # tsc -b (project-reference build mode) is required here — a bare `tsc` against this
      # solution-style tsconfig.json (files: [], references: [...]) silently checks zero files.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Playwright E2E is deferred to a later verification slice — needs a running backend, not just
      # a static build. See mycondo-docs/07-delivery/DELIVERY_ROADMAP.md Frontend Slice 2.
