name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-build:
    name: Install, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes strict TypeScript typecheck)
        run: npm run build

      # No `npm test` / `npm run test:e2e` step yet — no test runner is installed as of Wave 0.5.
      # See mycondo-docs/07-delivery/MASTER_BACKLOG.md PF-5. Add a test job here once it lands.
